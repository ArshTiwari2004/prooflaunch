spring:
  application:
    name: prooflaunch-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/prooflaunch}
    username: ${DB_USER:prooflaunch}
    password: ${DB_PASSWORD:prooflaunch}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none          # Flyway is the single owner of the schema
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 20
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8080
  shutdown: graceful
  forward-headers-strategy: native
  compression:
    enabled: true

management:
  server:
    port: ${MANAGEMENT_PORT:8081}   # actuator lives on a separate, non-published port
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  pattern:
    level: "%5p [%X{requestId:-}]"
  level:
    com.prooflaunch: INFO

app:
  jwt:
    # Dev-only default. In any real deployment JWT_SECRET MUST be set (>= 32 chars).
    secret: ${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me-0123456789}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:120}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  engagement:
    min-try-seconds: ${MIN_TRY_SECONDS:45}
    max-launches-per-day: ${MAX_LAUNCHES_PER_DAY:3}
  rate-limit:
    auth-per-minute: ${AUTH_RATE_LIMIT_PER_MINUTE:20}

springdoc:
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
